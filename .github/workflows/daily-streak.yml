name: Daily Dev Notes Sync

on:
  schedule:
    # 6 slot waktu sepanjang hari (UTC -> WIB = UTC + 7):
    # 01:30 UTC = ~08:30 WIB (Pagi)
    # 04:15 UTC = ~11:15 WIB (Menjelang Siang)
    # 07:20 UTC = ~14:20 WIB (Siang)
    # 10:40 UTC = ~17:40 WIB (Sore)
    # 13:25 UTC = ~20:25 WIB (Malam)
    # 16:15 UTC = ~23:15 WIB (Larut Malam)
    - cron: '30 1 * * *'
    - cron: '15 4 * * *'
    - cron: '20 7 * * *'
    - cron: '40 10 * * *'
    - cron: '25 13 * * *'
    - cron: '15 16 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force commit now regardless of slot check'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Dev Note
        id: note
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/generate_note.py $FORCE_FLAG

      - name: Commit and push changes
        if: steps.note.outputs.should_commit == 'true'
        run: |
          git config --global user.name "ALPHARIET"
          git config --global user.email "alfarian.adisaputra@gmail.com"
          git add .
          git commit -m "${{ steps.note.outputs.commit_msg }}"
          git push origin main
